name: SAST - Semgrep

on:
  pull_request:
    branches: [master]
  push:
    branches: ['**']

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (gate on Critical/High)
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --config=./semgrep-rules/custom-rules.yml \
            --error \
            --severity=ERROR \
            --text-output=semgrep-results.txt

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.txt

# Notes for the presentation:
# - Findings print directly to the Actions log (same human-readable format as
#   running "semgrep scan" locally) since we dropped --sarif output. This
#   avoids GitHub's Security-tab / pull_request_target complications entirely
#   and is simpler to demo live: click into the job, the findings are right there.
# - "--error --severity=ERROR" is what makes this job fail (exit non-zero) and
#   therefore block the merge, when Semgrep finds a rule at ERROR severity.
#   Map ERROR -> Critical/High, WARNING -> Medium, INFO -> Low in your own docs,
#   since Semgrep's severities don't use the same words as the challenge brief.
# - False positives: use inline `// nosemgrep: rule-id` with a mandatory reason
#   comment, or list a path in .semgrepignore. Don't silently disable a whole rule
#   org-wide just because one file trips it.
# - Trade-off if asked in Q&A: dropping SARIF means no GitHub Code Scanning UI
#   (no inline PR annotations, no Security tab dashboard). Chose simplicity and
#   demo reliability over that UI layer; SARIF + upload-sarif is one addition
#   away if the org wants centralized tracking later.