name: SAST - Semgrep

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (gate on Critical/High)
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --config=./semgrep-rules/custom-rules.yml \
            --sarif --output=semgrep-results.sarif \
            --error \
            --severity=ERROR

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

# Notes for the presentation:
# - "--error --severity=ERROR" is what makes this job fail (exit non-zero) and
#   therefore block the merge, when Semgrep finds a rule at ERROR severity.
#   Map ERROR -> Critical/High, WARNING -> Medium, INFO -> Low in your own docs,
#   since Semgrep's severities don't use the same words as the challenge brief.
# - False positives: use inline `// nosemgrep: rule-id` with a mandatory reason
#   comment, or list a path in .semgrepignore. Don't silently disable a whole rule
#   org-wide just because one file trips it.